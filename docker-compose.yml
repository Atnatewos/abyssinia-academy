version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: abyssinia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: abyssinia
      POSTGRES_PASSWORD: academy2026
      POSTGRES_DB: abyssinia_academy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - abyssinia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abyssinia -d abyssinia_academy"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  abyssinia-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local